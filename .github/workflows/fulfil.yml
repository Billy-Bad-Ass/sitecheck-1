name: Fulfil paid orders

# The sales page promises delivery within a working day, and fulfilment used
# to be a command a person had to remember to run. This runs it every ten
# minutes instead.
#
# Everything that makes an every-ten-minutes schedule safe lives in the
# pipeline, not here: the ledger of delivered orders is in R2 (a runner's
# filesystem is thrown away after each run, and this repository is public),
# "done" means the report was actually emailed, and a failed send is retried
# on the next run rather than recorded. See audit/src/pipeline/fulfil.ts.
#
# What this file contributes is making sure two runs can never overlap — a
# slow audit plus the next tick is the classic way a customer gets the same
# report twice.
on:
  schedule:
    # Every 20 minutes, not every 10.
    #
    # GitHub runs scheduled workflows on a best-effort basis and deprioritises
    # frequent ones. Asked for every 10 minutes, this actually ran at intervals
    # of one to two and a half hours through 2026-08-25/26, and then not at all
    # for 22 hours. A schedule that is not honoured is worse than a slower one
    # that is, because the gap between what it claims and what it does is
    # exactly the size of the surprise.
    #
    # The sales page promises delivery within one working day, so 20 minutes is
    # still an order of magnitude inside the promise. What actually protects it
    # is the reporting below: the console now knows this agent exists and when
    # it last ran, so a silence gets noticed by us rather than by a customer.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what is waiting; deliver nothing'
        type: boolean
        default: false
      self_test:
        description: 'Instead of fulfilling: check the delivery path end to end'
        type: boolean
        default: false
      self_test_email:
        description: 'With self_test: send one real email here to prove sending works'
        type: string
        default: ''

# One fulfilment run at a time, ever. queued rather than cancelled: killing a
# run mid-order is how a report gets emailed but never recorded.
concurrency:
  group: fulfil
  cancel-in-progress: false

jobs:
  fulfil:
    runs-on: ubuntu-latest
    # Well under the ten-minute schedule, so a hung site fetch cannot stack
    # runs behind the concurrency group indefinitely.
    timeout-minutes: 8
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/package-lock.json

      - run: npm ci

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Project 4's console owns the portfolio view. Until now this job posted
      # nothing at all, which is how it stopped running for 22 hours on
      # 2026-08-26 without anything noticing — and this is the only delivery
      # mechanism for the one product that takes live money.
      - name: Tell the dashboard a run started
        uses: ./.github/actions/report-run
        with:
          agent: order-fulfilment
          project_slug: project-1
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          status: running
          started_at: ${{ steps.start.outputs.started }}
          summary: Polling Stripe for paid audits to deliver.
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Fails safe on every missing credential:
      #   no STRIPE_SECRET_KEY               -> clean exit, nothing to do yet
      #   no CLOUDFLARE_* (ledger in R2)     -> refuses to run, nothing re-sent
      #   no RESEND_API_KEY                  -> refuses to run, nothing half-done
      #
      # STRIPE_SECRET_KEY must be a restricted READ key: nothing in the
      # pipeline writes to Stripe, and nothing ever should.
      # Whether this run could see an order at all, decided before the run so
      # the report at the end can say something true.
      #
      # Without STRIPE_SECRET_KEY the pipeline exits clean and the job goes
      # green — which is right for the job (there is nothing it can usefully
      # do) and wrong for the dashboard, which was being told "Checked Stripe
      # for paid audits" by a run that had not looked at Stripe. This product
      # takes live money and has no webhook: polling is the entire delivery
      # path, so a comfortable summary is the exact shape of the failure where
      # somebody pays and never hears from us.
      - id: armed
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_PAYMENT_LINK_ID: ${{ vars.STRIPE_PAYMENT_LINK_ID || secrets.STRIPE_PAYMENT_LINK_ID }}
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
        run: |
          missing=""
          [ -z "${STRIPE_SECRET_KEY// }" ] && missing="STRIPE_SECRET_KEY"
          [ -z "${RESEND_API_KEY// }" ] && missing="${missing:+$missing and }RESEND_API_KEY"
          # One of these two, not both. The pipeline refuses to list orders
          # without a payment link to scope them to — on purpose, because this
          # Stripe account also sells the printable guides and an unscoped
          # query would email every guide buyer an audit they never ordered.
          # The id scopes it directly; the checkout URL (already a secret, it
          # is what builds the buy button on the sales page) resolves to the
          # id at run time. Either arms it, so nobody has to go and find the
          # same link written a second way.
          if [ -z "${STRIPE_PAYMENT_LINK_ID// }" ] && [ -z "${STRIPE_PAYMENT_LINK// }" ]; then
            missing="${missing:+$missing and }STRIPE_PAYMENT_LINK_ID or STRIPE_PAYMENT_LINK"
          fi

          if [ -n "$missing" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fulfilment is not armed::$missing is not set, so paid audits cannot be seen or delivered. Every run since has reported success without checking Stripe."
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      # Checks the four things between a payment and a delivered report, doing
      # the real thing for each rather than inferring any of them. Every
      # scheduled run for months reported success while holding no Stripe key,
      # because "the job did not throw" and "somebody got their report" were
      # never the same question. This asks the second one, on demand, without
      # needing a customer to be the test case.
      - name: Self-test the delivery path
        if: inputs.self_test
        run: npm run selftest -- ${{ inputs.self_test_email && format('--to {0}', inputs.self_test_email) || '' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_PAYMENT_LINK_ID: ${{ vars.STRIPE_PAYMENT_LINK_ID || secrets.STRIPE_PAYMENT_LINK_ID }}
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}

      - name: Fulfil
        if: ${{ !inputs.self_test }}
        run: npm run fulfil -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Scopes the Stripe query to the audit product. A repo variable
          # rather than a secret, because a plink_ id is not one — it is in the
          # checkout URL every customer sees. Read from secrets too, so it
          # works wherever it was already put.
          STRIPE_PAYMENT_LINK_ID: ${{ vars.STRIPE_PAYMENT_LINK_ID || secrets.STRIPE_PAYMENT_LINK_ID }}
          # The same link written the other way. Used only when the id above
          # is unset, and resolved through Stripe rather than guessed at.
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          # Optional. Default sender is audit@bbanetwork.org, which needs the
          # domain verified in Resend; override if it is sending from another.
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO }}

      # Always runs, whatever the step above did. A fulfilment run that died is
      # the case the console most needs to hear about, so reporting it must not
      # be conditional on the thing that failed.
      - name: Tell the dashboard how it went
        if: always()
        uses: ./.github/actions/report-run
        with:
          agent: order-fulfilment
          project_slug: project-1
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          status: ${{ job.status == 'success' && 'ok' || 'failed' }}
          started_at: ${{ steps.start.outputs.started }}
          summary: >-
            ${{ steps.armed.outputs.armed != 'true'
                && format('NOT ARMED — {0} is not set. Stripe was never checked, so a paid audit would go undelivered and unnoticed.', steps.armed.outputs.missing)
                || (inputs.self_test
                    && (job.status == 'success'
                        && 'Self-test: the delivery path works end to end.'
                        || 'Self-test FAILED — a paid audit would not be delivered.')
                    || (job.status == 'success'
                        && 'Checked Stripe for paid audits.'
                        || 'Fulfilment run did not complete — paid audits may be undelivered.')) }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # No artifacts, deliberately. Delivered reports are a customer's paid-for
      # property and the archive is the R2 bucket; nothing from out/ leaves
      # the runner any other way.
